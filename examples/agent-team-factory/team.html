<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Team · 开发实验台</title>
<style>
:root{font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#23314a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #dce2ed;background:#fff;border-radius:8px;padding:8px 13px;color:#30405d}button:hover{border-color:#7386e7}button:disabled{opacity:.5;cursor:default}.primary{background:#435fe5;color:#fff;border-color:#435fe5}header{height:78px;padding:16px 28px;background:#fff;border-bottom:1px solid #e3e8f0;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:20px;margin:0}h2{font-size:20px;margin:0 0 12px}h3{font-size:15px;margin:0 0 9px}.muted{font-size:12px;color:#78859d}.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 78px)}aside{background:#fff;border-right:1px solid #e3e8f0;padding:20px 15px}.pool-title{display:flex;justify-content:space-between;margin:2px 8px 15px}.req{width:100%;text-align:left;margin-bottom:8px;padding:14px;display:block;overflow-wrap:anywhere}.req.selected{background:#eef2ff;border-color:#aebbf9}.req strong{display:block;margin-bottom:8px}.badge{display:inline-block;border-radius:5px;padding:2px 7px;font-size:11px;background:#edf1f8;color:#60708c}.running,.active{background:#eaf0ff;color:#3d5bd1}.accepted,.completed{background:#e7f5ef;color:#24815c}.blocked,.needs_input,.error,.failed{background:#fff0e7;color:#b36226}.review{background:#f1eaff;color:#7850bc}main{padding:26px;min-width:0;max-width:1500px;width:100%}.panel{background:white;border:1px solid #e2e7f0;border-radius:12px;padding:22px;margin-bottom:18px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:center}.intro p{margin:5px 0}.workers{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 0}.worker{border:1px solid #e5e9f2;border-radius:8px;min-width:145px;padding:9px 12px;background:#fafbfe}.worker{text-align:left;cursor:pointer}.worker.selected{border-color:#7386e7;background:#eef2ff}.worker:hover{border-color:#7386e7}.worker b{display:block;font-size:13px}.worker span{font-size:12px}.new-title{font-size:18px;margin-bottom:12px}textarea{resize:vertical;width:100%;border:1px solid #d7dfec;border-radius:9px;padding:13px;min-height:110px;outline:none;background:#fcfdff;color:#23314a}textarea:focus{border-color:#647ce6;box-shadow:0 0 0 3px #eef1ff}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.tabs{display:flex;gap:23px;border-bottom:1px solid #e5e9f1;margin:16px 0 22px}.tab{padding:11px 0;border:0;border-radius:0;background:transparent;color:#7a879e}.tab.on{color:#435fe5;border-bottom:3px solid #435fe5}.empty{padding:40px 20px;text-align:center;color:#7b88a0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.task{padding:17px;border:1px solid #e1e7f0;border-radius:10px;overflow-wrap:anywhere}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.task p{margin:9px 0}.task .meta{margin:8px 0;color:#7b88a0;font-size:12px}.small{font-size:12px;padding:5px 10px}.message{padding:16px 0;border-bottom:1px solid #edf0f5}.message:first-child{padding-top:0}.message .who{font-size:12px;color:#75839b;margin-bottom:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,SFMono-Regular,monospace;background:#f6f8fc;border:1px solid #e7ebf3;padding:13px;border-radius:7px;max-height:650px;overflow:auto;margin:9px 0}.markdown{overflow-wrap:anywhere}.markdown p{white-space:pre-wrap;margin:9px 0}.markdown h3{margin:16px 0 7px}.markdown ul{padding-left:22px}.timeline{border-left:2px solid #e4eafa;padding-left:18px;margin:12px 0}.timeline div{margin:9px 0;overflow-wrap:anywhere}.trace-layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:16px}.turn{display:block;text-align:left;width:100%;margin:0 0 7px;padding:10px}.turn.on{background:#eef2ff;border-color:#b7c2f6}details{margin:10px 0;padding:12px;border:1px solid #e4e9f2;border-radius:8px}summary{cursor:pointer;overflow-wrap:anywhere}.notice{border-radius:8px;background:#fff6e9;border:1px solid #f3d8ae;padding:12px 15px;margin-bottom:15px}.error-text{color:#a54935;white-space:pre-wrap}#viewer{margin-top:18px}.file{margin:7px 0;display:block}.label{margin-right:7px}.toolbar{display:flex;gap:8px;align-items:center}a{color:#435fe5}.native{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}.loading{color:#7b88a0}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #e2e7f0}.trace-layout{grid-template-columns:1fr}header{height:auto;padding:14px 18px;align-items:flex-start}main{padding:16px}.intro{display:block}.toolbar{flex-wrap:wrap}.tabs{gap:17px}.req{display:inline-block;max-width:280px;vertical-align:top;margin-right:7px}}
</style>
<header><div><h1>Agent Team <span class="muted">开发实验台</span></h1><div id="repository" class="muted">连接执行服务…</div></div><div class="toolbar"><span id="connection" class="badge">连接中</span><button id="pause">暂停新任务</button><button id="new">＋ 新建需求</button></div></header>
<div class="shell"><aside><div class="pool-title"><strong>需求池</strong><span id="request-count" class="muted">0</span></div><div id="requests"></div></aside>
<main><div id="error" class="error-text"></div><section class="panel intro"><div><h3>Leader 自主派发 · 固定 Worker 池</h3><p class="muted">你提出需求，Leader 选择 Skill 和执行顺序；任务、消息与原生轨迹实时留存。</p><div id="workers" class="workers"></div></div><div id="model" class="badge"></div></section>
<section id="agent-panel" class="panel" hidden><div class="row"><h2 id="agent-title"></h2><button id="close-agent" class="small">关闭成员详情</button></div><div id="agent-tabs" class="tabs"></div><div id="agent-content"></div><div id="agent-viewer" hidden></div></section>
<section id="new-panel" class="panel"><h2 class="new-title">你想开发什么？</h2><form id="submit-form"><textarea id="request-input" maxlength="30000" placeholder="描述你想实现的模型网关功能，或粘贴完整需求…" required></textarea><div class="actions"><span class="muted">只登记你实际提交的内容。Leader 有问题会在这里向你询问。</span><button class="primary" id="submit" type="submit">提交给 Leader</button></div></form></section>
<section id="detail" class="panel" hidden><div class="row"><h2 id="request-title"></h2><span id="request-status" class="badge"></span></div><div id="request-meta" class="muted"></div><div class="tabs" id="tabs"></div><div id="content"></div><div id="viewer" hidden></div></section>
<section id="welcome" class="panel empty"><h3>需求池是空的</h3><p>提交第一条需求后，可以查看 Leader 拆分、Worker 执行、团队通信和成果。</p></section>
</main></div>
<script>
let catalog=null,selectedActor=null,actorTab='trace',agentRenderKey='';
let state=null,selected=null,tab='overview',chosenTurn=null,trace=null,renderKey='',pending=false;const drafts={};const traceExpansion={};
const names={active:'处理中',needs_input:'待你补充',completed:'已完成',queued:'排队中',running:'执行中',review:'待 Leader 接受',accepted:'已接受',blocked:'已阻塞',failed:'执行失败',cancelled:'已取消',idle:'空闲',error:'需处理'};
const skillNames={research:'调研',prd:'需求梳理',architecture:'架构设计',development:'开发',testing:'测试'};
const tabs={overview:'概览',tasks:'任务',messages:'团队消息',trace:'执行轨迹',artifacts:'成果'};
const $=s=>document.querySelector(s);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function badge(status){return el('span',names[status]||status,'badge '+status)}
function date(value){return value?new Date(value*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'—'}
function button(label,fn,cls='small'){const b=el('button',label,cls);b.type='button';b.onclick=fn;return b}
function md(text){const box=el('div',undefined,'markdown');let code=false,buffer=[];for(const line of String(text||'').split('\n')){if(line.startsWith('```')){if(code){box.append(el('pre',buffer.join('\n')));buffer=[]}code=!code;continue}if(code){buffer.push(line);continue}if(/^#{1,6} /.test(line))box.append(el('h3',line.replace(/^#{1,6} /,'')));else if(line.trim())box.append(el('p',line));}if(buffer.length)box.append(el('pre',buffer.join('\n')));return box}
async function api(path,data){const r=await fetch(path,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw Error(value.error||'请求失败 '+r.status);return value}
function fail(error){$('#error').textContent=error.message||String(error)}
function openRequest(id){rememberTrace();$('#agent-content').replaceChildren();selectedActor=null;selected=id;chosenTurn=null;trace=null;renderKey='';$('#new-panel').hidden=true;$('#viewer').hidden=true;draw()}
function scopedTurns(){return state.turns.filter(t=>t.request_id===selected||(t.actor==='leader'&&(t.execution.request_ids||[]).includes(selected)))}
function view(label,body){const v=$(selectedActor?'#agent-viewer':'#viewer');v.hidden=false;v.replaceChildren(button('关闭',()=>v.hidden=true),el('h3',label),el('pre',body));v.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function artifact(task,path){try{const r=await api('/api/artifact?task='+encodeURIComponent(task.id)+'&path='+encodeURIComponent(path));view(path,r.body)}catch(e){fail(e)}}
async function diff(task){try{const r=await api('/api/diff?task='+encodeURIComponent(task.id));view(task.title+' · 变更',r.body)}catch(e){fail(e)}}
async function showSkill(name){try{view('Skill · '+name,(await api('/api/skill?name='+name)).body)}catch(e){fail(e)}}
function openActor(id){rememberTrace();$('#content').replaceChildren();selectedActor=id;actorTab='trace';chosenTurn=null;trace=null;agentRenderKey='';$('#agent-viewer').hidden=true;draw();$('#agent-panel').scrollIntoView({behavior:'smooth',block:'start'})}
function draw(){if(!state)return;$('#repository').textContent='model-relay-2 · '+state.config.integration_branch;$('#model').textContent=(state.config.model||'原生默认模型')+' · '+state.config.concurrency+' Workers';$('#request-count').textContent=state.requests.length;$('#pause').textContent=state.paused?'恢复任务派发':'暂停新任务';
 const workers=$('#workers');workers.replaceChildren();for(const a of state.actors){const card=button('',()=>openActor(a.id),'worker'+(selectedActor===a.id?' selected':''));card.append(el('b',a.id==='leader'?'Leader':a.id),badge(a.status));card.append(el('div','查看轨迹 · Skill 与工具','muted'));if(a.error)card.title=a.error;workers.append(card)}
 const pool=$('#requests');pool.replaceChildren();for(const r of state.requests){const b=button('',()=>openRequest(r.id),'req'+(r.id===selected?' selected':''));b.append(el('strong',r.body.split('\n')[0].slice(0,65)),badge(r.status),el('div',date(r.created),'muted'));pool.append(b)}if(!state.requests.length)pool.append(el('div','暂无需求，等待你提交。','empty'));
 $('#agent-panel').hidden=!selectedActor;if(selectedActor)drawActor();$('#welcome').hidden=state.requests.length>0||!!selectedActor;$('#detail').hidden=!selected||!!selectedActor;const req=state.requests.find(x=>x.id===selected);if(!req||selectedActor)return;
 $('#request-title').textContent=req.body.split('\n')[0].slice(0,110);const st=$('#request-status');st.textContent=names[req.status]||req.status;st.className='badge '+req.status;$('#request-meta').textContent=req.id+' · 提交于 '+date(req.created);const nav=$('#tabs');nav.replaceChildren();for(const [key,label]of Object.entries(tabs))nav.append(button(label,()=>{tab=key;renderKey='';drawContent()},'tab'+(key===tab?' on':'')));drawContent();}
function drawContent(){const req=state.requests.find(x=>x.id===selected);if(!req)return;const tasks=state.tasks.filter(x=>x.request_id===selected),messages=state.messages.filter(x=>x.request_id===selected),turns=scopedTurns();
 const key=JSON.stringify([selected,tab,req,tasks,messages,turns.map(x=>[x.id,x.status,x.reply,x.execution]),state.actors.map(a=>[a.id,a.status])]);if(key===renderKey&&tab!=='trace')return;const box=$('#content');if(document.activeElement?.tagName==='TEXTAREA'&&box.contains(document.activeElement))return;renderKey=key;rememberTrace();box.replaceChildren();
 if(state.integration_blocked)box.append(el('div','集成操作有未确认结果，已保留现场。请查看执行记录并处理后再继续。','notice'));
 if(tab==='overview'){box.append(el('h3','你的原始需求'),md(req.body));if(req.result)box.append(el('h3',req.status==='needs_input'?'Leader 需要你补充':'Leader 交付'),md(req.result));box.append(el('h3','任务进展'));if(!tasks.length)box.append(el('p',turns.length?'Leader 正在处理，尚未创建任务。':'需求已登记，等待 Leader 处理。','muted'));else{const timeline=el('div',undefined,'timeline');for(const t of tasks){const r=el('div');r.append(badge(t.status),el('span',' '+t.title+' · '+skillNames[t.skill]));timeline.append(r)}box.append(timeline)}const replies=turns.filter(x=>x.actor==='leader'&&x.reply);if(replies.length){box.append(el('h3','Leader 最新原生回复'),md(replies.at(-1).reply))}supplement(box)}
 if(tab==='tasks'){const grid=el('div',undefined,'grid');for(const t of tasks){const card=el('article',undefined,'task');const top=el('div',undefined,'row');top.append(button(skillNames[t.skill],()=>showSkill(t.skill)),badge(t.status));card.append(top,el('h3',t.title),el('div',t.id+' · '+(t.worker||'等待空闲 Worker'),'meta'));const details=el('details');details.append(el('summary','任务说明与依赖'),md(t.instructions),el('div','前置任务：'+(t.depends_on.join('、')||'无'),'muted'));card.append(details);if(t.result){const result=el('details');result.append(el('summary','Worker 原始结果'),md(t.result));card.append(result)}if(t.candidate)card.append(button('查看变更',()=>diff(t)));for(const path of t.artifacts)card.append(button(path,()=>artifact(t,path),'small file'));if(t.integration_commit)card.append(el('div','集成版本 '+t.integration_commit.slice(0,12),'meta'));grid.append(card)}box.append(grid);if(!tasks.length)box.append(el('div','Leader 尚未派发任务。','empty'))}
 if(tab==='messages'){for(const m of messages){const row=el('div',undefined,'message');row.append(el('div',m.sender+' → '+m.recipient+' · '+date(m.created),'who'),md(m.body));box.append(row)}supplement(box)}
 if(tab==='trace')drawTurns(box,turns);
 if(tab==='artifacts'){let count=0;for(const t of tasks){if(t.candidate)box.append(button(t.title+' · 代码变更',()=>diff(t),'file'));for(const path of t.artifacts){box.append(button(t.title+' / '+path,()=>artifact(t,path),'file'));count++}}if(!count)box.append(el('div','尚无已交接产物。','empty'));const tip=el('div','工作区与集成分支在执行机留存；本实验不自动创建 Issue、PR 或推送 GitHub。','muted');box.append(tip)}
}
function drawActor(){
 const actor=state.actors.find(a=>a.id===selectedActor);if(!actor)return;
 $('#agent-title').textContent=(actor.id==='leader'?'Leader':actor.id)+' · '+(names[actor.status]||actor.status);
 const nav=$('#agent-tabs');nav.replaceChildren();for(const [key,label]of [['trace','执行轨迹'],['config','Skill 与工具']])nav.append(button(label,()=>{actorTab=key;agentRenderKey='';drawActor()},'tab'+(actorTab===key?' on':'')));
 const turns=state.turns.filter(t=>t.actor===selectedActor),box=$('#agent-content');
 const key=JSON.stringify([selectedActor,actorTab,actor,turns,state.tasks,catalog]);if(actorTab!=='trace'&&key===agentRenderKey)return;agentRenderKey=key;rememberTrace();box.replaceChildren();
 if(actor.error)box.append(el('div',actor.error,'notice'));
 if(actor.id==='leader'&&actor.status==='error')box.append(button('继续 Leader',async()=>{try{await api('/api/leader/continue',{});await refresh()}catch(e){fail(e)}}));
 if(actorTab==='trace'){drawTurns(box,turns);return}
 const latest=turns.find(t=>t.id===actor.active_turn)||turns.at(-1),task=state.tasks.find(t=>t.id===latest?.task_id);
 box.append(el('h3','执行配置'),el('p','执行器：Codex CLI · 模型：'+state.config.model));
 if(task)box.append(el('p','最近任务：'+task.title));
 box.append(el('h3','Skill'));
 if(actor.id==='leader')box.append(el('p','Leader 不固定加载 Skill；派发任务时从下面的 Skill 中选择。'));
 else if(task)box.append(el('p','最近任务加载：'+task.skill+'（'+skillNames[task.skill]+'）'));
 else box.append(el('p','空闲时不加载任务 Skill，领取任务后加载 Leader 指定的那一份。'));
 const skills=el('div',undefined,'toolbar');for(const name of catalog?.skills||[])skills.append(button(name+' · '+skillNames[name],()=>showSkill(name)));box.append(skills);
 box.append(el('h3','团队工具'));
 for(const tool of (actor.id==='leader'?catalog?.leader_tools:catalog?.worker_tools)||[]){const d=el('details');d.append(el('summary',tool.name+' · '+tool.description),el('pre',JSON.stringify(tool.inputSchema,null,2)));box.append(d)}
 box.append(el('p','原生执行器提供的其他工具，以执行轨迹中的实际调用记录为准。','muted'));
 if(latest)box.append(button('查看最近轮次的实际输入与启动配置',()=>{actorTab='trace';chosenTurn=latest.id;trace=null;drawActor()}));
}
function drawTurns(box,turns){const layout=el('div',undefined,'trace-layout'),list=el('div'),right=el('div');
 if(!turns.some(t=>t.id===chosenTurn)){chosenTurn=turns.at(-1)?.id||null;trace=null}
 for(const t of [...turns].reverse()){const b=button('',()=>{chosenTurn=t.id;trace=null;renderKey='';if(selectedActor)drawActor();else drawContent()},'turn'+(t.id===chosenTurn?' on':''));b.append(el('strong',t.actor),badge(t.status),el('div',date(t.created),'muted'));if(t.task_id)b.append(el('div',state.tasks.find(x=>x.id===t.task_id)?.title||t.task_id,'muted'));list.append(b)}
 right.id='trace-body';layout.append(list,right);box.append(layout);if(chosenTurn){if(trace?.turn.id===chosenTurn)renderTrace(right,trace);else right.append(el('div','读取原生执行记录…','loading'));loadTrace(chosenTurn)}else right.append(el('div','该成员尚无执行轮次。','empty'));
}
function supplement(box){const requestId=selected;const form=el('form');form.style.marginTop='22px';form.append(el('h3','补充需求 / 回复 Leader'));const input=el('textarea');input.placeholder='补充背景、回答问题，或调整这个需求…';input.maxLength=30000;input.required=true;input.value=drafts[requestId]||'';input.oninput=()=>drafts[requestId]=input.value;const send=el('button','发送给 Leader','primary');send.type='submit';form.append(input,send);form.onsubmit=async e=>{e.preventDefault();send.disabled=true;const submitted=input.value;input.disabled=true;try{await api('/api/requests/'+requestId+'/messages',{text:submitted});if(input.value===submitted){input.value='';drafts[requestId]='';}renderKey='';await refresh()}catch(error){fail(error)}finally{send.disabled=false;input.disabled=false}};box.append(form)}
let loadingTurn=false;async function loadTrace(id){if(loadingTurn)return;loadingTurn=true;try{const value=await api('/api/trace?turn='+encodeURIComponent(id));if(id===chosenTurn&&(selectedActor?actorTab==='trace':tab==='trace')){trace=value;const box=$('#trace-body');if(box)renderTrace(box,value)}}catch(e){fail(e)}finally{loadingTurn=false}}
function rememberTrace(){const b=$('#trace-body');if(b?.dataset.turn)traceExpansion[b.dataset.turn]=[...b.querySelectorAll('details[open]')].map(x=>x.dataset.key)}
function renderTrace(box,data){rememberTrace();const open=new Set(traceExpansion[data.turn.id]||[]);box.dataset.turn=data.turn.id;box.replaceChildren();const turn=data.turn;box.append(el('h3',turn.actor+' · 原生执行'),el('div',date(turn.created)+' → '+date(turn.finished),'muted'));const input=el('details');input.dataset.key='input';input.open=open.has('input');input.append(el('summary','实际下发输入（含任务和 Skill）'),md(data.input));box.append(input);if(data.invocation){const d=el('details');d.dataset.key='invocation';d.open=open.has('invocation');d.append(el('summary','模型、工作区与实际启动配置'),el('pre',JSON.stringify(data.invocation,null,2)));box.append(d)}if(data.team_events?.length){const d=el('details');d.dataset.key='team-events';d.open=open.has('team-events');d.append(el('summary','团队工具与派发记录'),el('pre',JSON.stringify(data.team_events,null,2)));box.append(d)}for(let i=0;i<data.events.length;i++){const e=data.events[i],item=e.item;
 if(item&&['agent_message','reasoning'].includes(item.type)&&typeof item.text==='string'){box.append(el('div',e.type+' · '+item.type,'muted'),md(item.text))}
 const d=el('details');d.dataset.key=String(i);d.open=open.has(String(i));d.append(el('summary',[e.type,item?.type,item?.tool||item?.name||item?.command||item?.status].filter(Boolean).join(' · ').slice(0,180)),el('pre',JSON.stringify(e,null,2)));box.append(d);
 }if(turn.reply)box.append(el('h3','本轮最终原生回复'),md(turn.reply));if(data.stderr){const d=el('details');d.dataset.key='stderr';d.open=open.has('stderr');d.append(el('summary','执行器 stderr'),el('pre',data.stderr));box.append(d)}if(!data.events.length)box.append(el('p','原生进程尚未返回事件。','muted'))}
async function refresh(){try{const current=await api('/api/state');state=current;$('#connection').textContent='实时连接';$('#connection').className='badge accepted';$('#error').textContent='';draw()}catch(e){$('#connection').textContent='连接中断';$('#connection').className='badge error';fail(e)}}
$('#close-agent').onclick=()=>{rememberTrace();$('#agent-content').replaceChildren();selectedActor=null;chosenTurn=null;trace=null;renderKey='';draw()};
$('#new').onclick=()=>{$('#new-panel').hidden=false;$('#request-input').focus()};$('#pause').onclick=async()=>{if(!state)return;try{await api('/api/pause',{paused:!state.paused});await refresh()}catch(e){fail(e)}};
$('#submit-form').onsubmit=async e=>{e.preventDefault();if(pending)return;pending=true;$('#submit').disabled=true;const input=$('#request-input');const body=input.value;input.disabled=true;let saved;try{saved=JSON.parse(sessionStorage.getItem('pending-requirement')||'null')}catch(_){saved=null}if(!saved||saved.body!==body)saved={body,key:crypto.randomUUID()};sessionStorage.setItem('pending-requirement',JSON.stringify(saved));try{const req=await api('/api/requests',{text:body,client_id:saved.key});sessionStorage.removeItem('pending-requirement');if(input.value===body)input.value='';await refresh();openRequest(req.id)}catch(e){fail(e)}finally{pending=false;$('#submit').disabled=false;input.disabled=false}};
api('/api/catalog').then(value=>{catalog=value;agentRenderKey='';if(state)draw()}).catch(fail);
refresh();setInterval(refresh,2000);
</script></html>
