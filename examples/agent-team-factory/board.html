<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Team · 软件工厂实验</title>
<style>
:root{font:15px/1.6 system-ui,-apple-system,sans-serif;color:#263149;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:auto;padding:32px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:26px;margin:0}h2{font-size:18px;margin:28px 0 14px}.muted{color:#72809a;font-size:13px}.badge{background:#e9edff;color:#4b5fd1;border-radius:6px;padding:4px 9px;font-size:12px}.stats{display:flex;gap:14px;flex-wrap:wrap;margin:24px 0}.stat{background:white;border:1px solid #e1e6ef;border-radius:10px;padding:13px 20px;min-width:145px}.stat b{font-size:25px;display:block}#tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.task{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:18px;cursor:pointer}.task:hover{border-color:#6c7be5}.task h3{font-size:16px;margin:10px 0}.task p{font-size:12px;margin:6px 0;overflow-wrap:anywhere}.top{display:flex;justify-content:space-between;gap:8px}.running{color:#435bd3}.failed,.conflict{color:#b34040}.merged{color:#25845c}.blocked,.interrupted{color:#9a671e}.panel{background:white;border:1px solid #e1e6ef;border-radius:12px;padding:20px;margin-top:14px;overflow-wrap:anywhere}pre{white-space:pre-wrap;font:13px/1.75 ui-monospace,monospace;overflow-wrap:anywhere;margin:10px 0}.message{padding:12px 0;border-bottom:1px solid #edf0f5}.message:last-child{border:0}button{border:1px solid #dfe5ef;border-radius:7px;background:white;padding:6px 13px;cursor:pointer}#error{color:#a33;white-space:pre-wrap}#config{overflow-wrap:anywhere}@media(max-width:600px){main{padding:18px}header{align-items:flex-start}h1{font-size:22px}.stat{min-width:120px;flex:1}}
</style>
<main>
<header><div><h1>Agent Team <span class="muted">软件工厂实验</span></h1><div id="config" class="muted"></div></div><span class="badge">独立实验分支</span></header>
<div id="error"></div><section id="stats" class="stats"></section>
<h2>任务池</h2><div id="tasks"></div>
<section id="detail" class="panel" hidden></section>
<h2>团队消息</h2><section id="messages" class="panel"></section>
<h2>执行记录</h2><section id="events" class="panel"></section>
</main>
<script>
const labels={pending:'待执行',running:'执行中',ready:'候选已提交',blocked:'已阻塞',failed:'失败',interrupted:'已中断',merged:'已汇合',conflict:'合并冲突'};let selected=null,state=null;
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function when(value){return value?new Date(value*1000).toLocaleString():'—'}
function detail(){const box=document.querySelector('#detail');box.replaceChildren();box.hidden=!selected;if(!selected)return;const task=state.tasks.find(x=>x.id===selected);if(!task){box.hidden=true;return}const close=el('button','关闭');close.onclick=()=>{selected=null;detail()};box.append(close,el('h2',task.title),el('div',task.id+' · '+labels[task.status],'muted'),el('pre',task.instructions));if(task.submission){box.append(el('h3','Worker 原始交接'),el('pre',task.submission.message))}if(task.result){box.append(el('h3','执行结果'),el('pre',JSON.stringify(task.result,null,2)))}if(task.execution){box.append(el('h3','执行关联'),el('pre',JSON.stringify(task.execution,null,2)))}}
async function refresh(){try{const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)throw Error('读取失败 '+response.status);state=await response.json();document.querySelector('#error').textContent='';document.querySelector('#config').textContent=state.config.integration_branch+' · '+(state.config.model||'原生默认模型')+' · '+state.config.repository;const stats=document.querySelector('#stats');stats.replaceChildren();for(const [name,value] of [['任务总数',state.tasks.length],['执行中 / 上限',state.running+' / '+state.config.concurrency],['Worker 执行峰值',state.peak_native_processes],['已汇合',state.tasks.filter(t=>t.status==='merged').length]]){const card=el('div',undefined,'stat');card.append(el('span',name,'muted'),el('b',String(value)));stats.append(card)}const tasks=document.querySelector('#tasks');tasks.replaceChildren();for(const task of state.tasks){const card=el('article',undefined,'task');const top=el('div',undefined,'top');top.append(el('span',task.id,'muted'),el('span',labels[task.status]||task.status,task.status));card.append(top,el('h3',task.title),el('p',task.execution.branch||'等待派发','muted'),el('p','开始 '+when(task.started),'muted'));card.onclick=()=>{selected=task.id;detail()};tasks.append(card)}if(!state.tasks.length)tasks.append(el('p','等待 Leader 拆解任务。','muted'));const messages=document.querySelector('#messages');messages.replaceChildren();for(const message of state.messages){const row=el('div',undefined,'message');row.append(el('div',message.sender+' → '+message.recipient+' · '+when(message.created),'muted'),el('pre',message.body));messages.append(row)}if(!state.messages.length)messages.append(el('span','暂无消息','muted'));const events=document.querySelector('#events');events.replaceChildren();for(const event of state.events.slice(-40).reverse())events.append(el('div',when(event.created)+' · '+(event.task_id||'Leader')+' · '+event.kind,'muted'));detail()}catch(error){document.querySelector('#error').textContent=error.message}}
refresh();setInterval(refresh,2500);
</script>
</html>
